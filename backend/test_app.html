<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bond Touch — Live Test</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #0d0d10;
      --surface: #16161c;
      --border: #2a2a38;
      --pink: #e85d9a;
      --purple: #7c5cbf;
      --green: #48bb78;
      --red: #fc8181;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: #e8e8f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }

    body.flash {
      animation: flash 0.6s ease;
    }

    @keyframes flash {
      0%   { background: #4a0030; }
      30%  { background: #e85d9a; }
      100% { background: var(--bg); }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    /* SETUP SCREEN */
    #setup h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    #setup p {
      color: #888898;
      font-size: 14px;
      margin-bottom: 32px;
    }

    input {
      width: 100%;
      background: #0d0d10;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #e8e8f0;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      padding: 14px 16px;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--pink); }
    input::placeholder { color: #555565; }

    button.primary {
      width: 100%;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border: none;
      border-radius: 14px;
      color: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      padding: 16px;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }

    button.primary:hover { opacity: 0.9; transform: translateY(-1px); }
    button.primary:active { transform: scale(0.98); }

    /* MAIN SCREEN */
    #main { display: none; }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      color: #888898;
      font-size: 13px;
    }

    .user-info {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .pair-code {
      color: var(--pink);
      font-size: 13px;
      font-family: monospace;
      letter-spacing: 0.1em;
      margin-bottom: 40px;
    }

    /* TOUCH BUTTON */
    .touch-btn-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }

    #touchBtn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      box-shadow: 0 0 40px rgba(232, 93, 154, 0.35);
      cursor: pointer;
      font-size: 52px;
      transition: transform 0.15s, box-shadow 0.15s;
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 30px rgba(232,93,154,0.3); }
      50% { box-shadow: 0 0 60px rgba(232,93,154,0.6); }
    }

    #touchBtn:hover { transform: scale(1.06); }
    #touchBtn:active { transform: scale(0.94); box-shadow: 0 0 20px rgba(232,93,154,0.2); }

    .btn-label {
      color: #888898;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    /* LAST TOUCH */
    .last-touch {
      background: #0d0d10;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      color: #888898;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .last-touch.received {
      border-color: var(--pink);
      color: var(--pink);
    }

    /* LED INDICATOR */
    .led {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #333;
      margin: 0 auto 20px;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .led.on {
      background: var(--green);
      box-shadow: 0 0 16px var(--green);
    }
  </style>
</head>
<body>

<!-- ============ SETUP SCREEN ============ -->
<div class="card" id="setup">
  <h1>❤️ Bond Touch</h1>
  <p>Enter your name and a 6-digit pair code.<br>Both you and your friend must use the <strong>same pair code</strong>.</p>

  <input id="nameInput" type="text" placeholder="Your name (e.g. Ahmed)" maxlength="20" />
  <input id="codeInput" type="number" placeholder="6-digit pair code (e.g. 102030)" maxlength="6" />
  <input id="serverInput" type="text" value="https://band-beryl.vercel.app" placeholder="Server URL" />

  <button class="primary" onclick="startApp()">Start ❤️</button>
</div>

<!-- ============ MAIN SCREEN ============ -->
<div class="card" id="main">
  <div class="status-row">
    <div class="dot"></div>
    <span class="status-text">Connected to Bond Touch Server</span>
  </div>

  <div class="led" id="led"></div>
  <div class="user-info" id="userName"></div>
  <div class="pair-code" id="pairCodeDisplay"></div>

  <div class="touch-btn-wrap">
    <button id="touchBtn" onclick="sendTouch()">❤️</button>
  </div>
  <div class="btn-label">Tap to send touch to partner</div>

  <div class="last-touch" id="lastTouchDisplay">No touches yet...</div>
</div>

<script>
  let myName = '';
  let pairCode = '';
  let serverUrl = '';
  let lastSeenTimestamp = 0;
  let pollingInterval = null;

  function startApp() {
    myName = document.getElementById('nameInput').value.trim();
    pairCode = document.getElementById('codeInput').value.trim();
    serverUrl = document.getElementById('serverInput').value.trim();

    if (!myName || !pairCode || pairCode.length < 4) {
      alert('Please enter your name and at least a 4-digit pair code!');
      return;
    }

    // Show main screen
    document.getElementById('setup').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    document.getElementById('userName').textContent = '👤 ' + myName;
    document.getElementById('pairCodeDisplay').textContent = 'Pair Code: ' + pairCode;

    // Start polling for partner touches every 700ms
    lastSeenTimestamp = Date.now();
    pollingInterval = setInterval(checkForTouch, 700);
  }

  async function sendTouch() {
    document.getElementById('touchBtn').style.transform = 'scale(0.92)';
    setTimeout(() => document.getElementById('touchBtn').style.transform = '', 150);

    try {
      const res = await fetch(serverUrl + '/api/touch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pairCode, senderName: myName })
      });
      const data = await res.json();
      
      // Flash own LED briefly to confirm send
      flashLed();
      document.getElementById('lastTouchDisplay').textContent = '✅ Touch sent to partner!';
      document.getElementById('lastTouchDisplay').classList.remove('received');
    } catch (e) {
      alert('Could not reach server. Check your internet connection!');
    }
  }

  async function checkForTouch() {
    try {
      const res = await fetch(
        `${serverUrl}/api/check?pairCode=${pairCode}&myName=${encodeURIComponent(myName)}&lastSeen=${lastSeenTimestamp}`
      );
      const data = await res.json();

      if (data.newTouch) {
        lastSeenTimestamp = data.timestamp;
        onTouchReceived(data.senderName);
      }
    } catch (e) {
      // Silently ignore network blips
    }
  }

  function onTouchReceived(senderName) {
    // Flash the whole screen pink!
    document.body.classList.add('flash');
    setTimeout(() => document.body.classList.remove('flash'), 600);

    // Light up LED
    flashLed();

    // Vibrate phone (works on Android Chrome!)
    if (navigator.vibrate) {
      navigator.vibrate([300, 100, 300]);
    }

    // Update last touch display
    const now = new Date().toLocaleTimeString('en-EG', { hour: '2-digit', minute: '2-digit' });
    const display = document.getElementById('lastTouchDisplay');
    display.textContent = `❤️ ${senderName} touched you at ${now}!`;
    display.classList.add('received');
  }

  function flashLed() {
    const led = document.getElementById('led');
    led.classList.add('on');
    setTimeout(() => led.classList.remove('on'), 600);
  }
</script>

</body>
</html>
