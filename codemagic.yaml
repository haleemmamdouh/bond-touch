workflows:
  ios-workflow:
    name: Bond Touch iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_PROJECT: "ios_app/BondTouchiOS.xcodeproj"
        XCODE_SCHEME: "BondTouchiOS"
      xcode: latest
    scripts:
      - name: Build Native iOS App
        script: |
          cd ios_app
          xcodebuild \
            -project BondTouchiOS.xcodeproj \
            -scheme BondTouchiOS \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR=build \
            build
          cd build/Release-iphoneos
          zip -r BondTouchiOS.app.zip BondTouchiOS.app
    artifacts:
      - ios_app/build/Release-iphoneos/BondTouchiOS.app.zip
      - ios_app/build/Release-iphoneos/*.app
      - build/**/*.app
