workflows:
  ios-workflow:
    name: Bond Touch iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: AC_API_KEY
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.bondtouch.app
      vars:
        BUNDLE_ID: com.bondtouch.app
        XCODE_SCHEME: BondTouchiOS
        XCODE_WORKSPACE: BondTouchiOS.xcworkspace
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd ios_app
          pod install --repo-update
      - name: Build iOS app
        script: |
          cd ios_app
          xcode-project use-profiles
          xcodebuild \
            -workspace BondTouchiOS.xcworkspace \
            -scheme BondTouchiOS \
            -configuration Release \
            -archivePath build/BondTouch.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/BondTouch.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/output
    artifacts:
      - ios_app/build/output/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com
