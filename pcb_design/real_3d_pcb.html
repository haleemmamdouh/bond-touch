<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photorealistic 3D PCB CAD Inspection (20mm x 16mm)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050508; color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; }
    #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }
    .hud { position: absolute; top: 20px; left: 20px; background: rgba(15, 15, 23, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); padding: 18px 22px; border-radius: 14px; width: 280px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); pointer-events: none; }
    .hud h2 { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .tag { font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; background: #0284c7; color: #fff; font-weight: 600; text-transform: uppercase; }
    .hud-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; color: #a1a1aa; }
    .hud-row span:last-child { color: #38bdf8; font-weight: 600; font-mono: true; }
    .controls { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(15, 15, 23, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); padding: 10px 20px; border-radius: 30px; font-size: 0.8rem; color: #a1a1aa; pointer-events: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container">
    <div class="hud">
      <h2>Haptic Bracelet V1 <span class="tag">CAD PBR</span></h2>
      <div class="hud-row"><span>Board Size:</span><span>20.0 × 16.0 × 1.2 mm</span></div>
      <div class="hud-row"><span>Process:</span><span>ENIG Gold / Matte Black</span></div>
      <div class="hud-row"><span>MCU:</span><span>ESP32-C3-MINI-1</span></div>
      <div class="hud-row"><span>Charger:</span><span>LP4060 (USB-C 500mA)</span></div>
      <div class="hud-row"><span>Sensor:</span><span>Integrated Touch Copper</span></div>
    </div>
    <div class="controls-hint controls">🖱️ Drag to Rotate | Scroll to Zoom | Right-Click to Pan</div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 40);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.04;
    controls.maxPolarAngle = Math.PI / 2 + 0.1;

    // --- LIGHTING ---
    const ambLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambLight);

    const keyLight = new THREE.DirectionalLight(0xfff5ea, 2.5);
    keyLight.position.set(25, 45, 30);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    fillLight.position.set(-30, 20, -20);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xa855f7, 1.0);
    rimLight.position.set(0, -30, -30);
    scene.add(rimLight);

    // --- MATERIALS (Realistic PBR) ---
    // Matte Black Solder Mask
    const pcbMat = new THREE.MeshStandardMaterial({
      color: 0x111116,
      roughness: 0.45,
      metalness: 0.1,
    });

    // Gold Plating (ENIG)
    const goldMat = new THREE.MeshStandardMaterial({
      color: 0xf59e0b,
      metalness: 0.95,
      roughness: 0.15,
    });

    // Solder Fillet Material
    const solderMat = new THREE.MeshStandardMaterial({
      color: 0xd4d4d8,
      metalness: 0.98,
      roughness: 0.1,
    });

    // IC Body Epoxy
    const icMat = new THREE.MeshStandardMaterial({
      color: 0x1c1c22,
      roughness: 0.6,
      metalness: 0.05
    });

    // Metal Shield
    const metalMat = new THREE.MeshStandardMaterial({
      color: 0xe4e4e7,
      metalness: 0.95,
      roughness: 0.15
    });

    // --- PCB BOARD ASSEMBLY (20mm x 16mm) ---
    const boardGroup = new THREE.Group();
    scene.add(boardGroup);

    // Board Base
    const boardGeo = new THREE.BoxGeometry(20, 1.2, 16);
    const boardMesh = new THREE.Mesh(boardGeo, pcbMat);
    boardMesh.receiveShadow = true;
    boardMesh.castShadow = true;
    boardGroup.add(boardMesh);

    // Gold Edge Plating & Pads
    for(let x = -8.5; x <= 8.5; x += 3.4) {
      const pad1 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.05, 1.5), goldMat);
      pad1.position.set(x, 0.62, 7);
      boardGroup.add(pad1);

      const pad2 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.05, 1.5), goldMat);
      pad2.position.set(x, 0.62, -7);
      boardGroup.add(pad2);
    }

    // --- COMPONENTS ---

    // 1. ESP32-C3 MINI Module
    const espGroup = new THREE.Group();
    const espBase = new THREE.Mesh(new THREE.BoxGeometry(10, 0.8, 11), icMat);
    espBase.position.set(0, 1.0, -1.5);
    espBase.castShadow = true;
    espGroup.add(espBase);

    // ESP32 Metal Can
    const espCan = new THREE.Mesh(new THREE.BoxGeometry(8.5, 1.0, 8.5), metalMat);
    espCan.position.set(0, 1.8, -2.5);
    espCan.castShadow = true;
    espGroup.add(espCan);
    boardGroup.add(espGroup);

    // 2. USB Type-C Receptacle
    const usbGroup = new THREE.Group();
    const usbShell = new THREE.Mesh(new THREE.BoxGeometry(8.8, 3.0, 6.5), metalMat);
    usbShell.position.set(0, 1.7, 6.2);
    usbShell.castShadow = true;
    usbGroup.add(usbShell);

    // USB Tongue
    const usbTongue = new THREE.Mesh(new THREE.BoxGeometry(6.8, 0.7, 5.0), icMat);
    usbTongue.position.set(0, 1.7, 6.8);
    usbGroup.add(usbTongue);
    boardGroup.add(usbGroup);

    // 3. LP4060 Charger (SOT-23-5)
    const charger = new THREE.Mesh(new THREE.BoxGeometry(2.9, 1.1, 1.6), icMat);
    charger.position.set(-6.2, 1.15, 4.0);
    charger.castShadow = true;
    boardGroup.add(charger);

    // 4. TTP223 Touch IC (SOT-23-6)
    const touchIC = new THREE.Mesh(new THREE.BoxGeometry(2.9, 1.1, 1.6), icMat);
    touchIC.position.set(6.2, 1.15, 4.0);
    touchIC.castShadow = true;
    boardGroup.add(touchIC);

    // 5. MMBT2222A Transistor (SOT-23)
    const trans = new THREE.Mesh(new THREE.BoxGeometry(2.9, 1.1, 1.4), icMat);
    trans.position.set(-6.2, 1.15, -4.0);
    trans.castShadow = true;
    boardGroup.add(trans);

    // 6. WS2812B Micro RGB LED (2020 SMD)
    const led = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.7, 2.0), new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.1,
      emissive: 0x38bdf8,
      emissiveIntensity: 0.6
    }));
    led.position.set(0, 0.95, -6.5);
    boardGroup.add(led);

    // 7. SMD Capacitors & Resistors (0402/0603)
    const passives = [
      { x: -3, z: 4.5, w: 1.0, d: 0.5, c: 0x887766 },
      { x: 3, z: 4.5, w: 1.0, d: 0.5, c: 0x887766 },
      { x: -3, z: -4.5, w: 0.8, d: 0.4, c: 0x222222 },
      { x: 3, z: -4.5, w: 0.8, d: 0.4, c: 0x222222 },
    ];
    passives.forEach(p => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(p.w, 0.5, p.d), new THREE.MeshStandardMaterial({ color: p.c, roughness: 0.3 }));
      mesh.position.set(p.x, 0.85, p.z);
      boardGroup.add(mesh);
    });

    // 8. Bottom Layer Integrated Copper Touch Pad
    const touchPad = new THREE.Mesh(new THREE.BoxGeometry(15, 0.05, 11), goldMat);
    touchPad.position.set(0, -0.62, 0);
    boardGroup.add(touchPad);

    // --- RENDER LOOP ---
    function animate() {
      requestAnimationFrame(animate);
      boardGroup.rotation.y += 0.002;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
